<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyFinance — Accounts</title>
  <!-- Tailwind Compiled CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <aside id="sidebar" class="sidebar hidden-mobile lg:!transform-none"></aside>
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <main class="lg:pl-[260px] min-h-screen pb-28 lg:pb-8">

    <header class="sticky top-0 z-20 bg-bg-primary/85 backdrop-blur border-b border-brd">
      <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16">
        <div class="flex items-center gap-3 lg:hidden">
          <button data-open-sidebar class="w-9 h-9 rounded-lg bg-bg-card border border-brd flex items-center justify-center">
            <i data-lucide="menu" class="w-4 h-4 text-txt-primary"></i>
          </button>
          <span class="font-bold text-txt-primary">Accounts</span>
        </div>
        <div class="hidden lg:block">
          <h1 class="text-xl font-bold text-txt-primary">Accounts</h1>
          <div class="text-xs text-txt-secondary">Manage your cash, bank, and card accounts</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-add-account"
                  class="h-9 px-3 rounded-lg bg-accent hover:bg-accent-hover text-[#06221a] text-xs font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span class="hidden sm:inline">New Account</span>
          </button>
          <button data-signout class="w-9 h-9 rounded-full bg-accent-2 flex items-center justify-center text-txt-primary text-xs font-bold">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="px-4 sm:px-6 lg:px-8 py-6 max-w-[1400px] mx-auto space-y-6">

      <div class="card balance-card">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs text-txt-secondary">Total Balance (all accounts)</div>
            <div id="acc-total" class="text-3xl font-bold text-txt-primary mt-1">₹0</div>
          </div>
          <div class="w-11 h-11 rounded-xl bg-accent/15 flex items-center justify-center">
            <i data-lucide="wallet" class="w-5 h-5 text-accent"></i>
          </div>
        </div>
      </div>

      <div id="acc-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </div>
  </main>

  <button id="fab-add-account" class="fab lg:hidden" aria-label="Add account">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <nav id="mobile-nav" class="bottom-nav lg:hidden"></nav>

  <!-- Add / Edit Account Modal -->
  <div id="acc-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4 py-6 overflow-y-auto">
    <div data-modal-backdrop class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-lg card p-6 my-auto">

      <div class="flex items-center justify-between mb-4">
        <h2 id="acc-modal-title" class="text-base font-semibold text-txt-primary">New Account</h2>
        <button data-close-modal class="w-8 h-8 rounded-lg bg-bg-secondary border border-brd flex items-center justify-center text-txt-secondary hover:text-txt-primary transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="acc-form" class="space-y-3">

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Account Name</label>
          <input id="acc-name" type="text" required maxlength="60"
                 class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent" />
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Type</label>
          <select id="acc-type"
                  class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent">
            <option value="cash">Cash</option>
            <option value="savings">Savings</option>
            <option value="salary">Salary</option>
            <option value="upi">UPI</option>
            <option value="credit_card">Credit Card</option>
            <option value="personal">Personal</option>
            <option value="home">Home</option>
            <option value="office">Office</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Opening Balance</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-txt-secondary text-sm">₹</span>
            <input id="acc-opening" type="number" step="0.01" value="0"
                   class="w-full h-11 pl-8 pr-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent" />
          </div>
          <p class="text-[10px] text-txt-secondary mt-1">
            Balance will auto-adjust as you add transactions.
          </p>
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Description <span class="opacity-60">(optional)</span></label>
          <input id="acc-desc" type="text" maxlength="100"
                 class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent" />
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Color</label>
          <div id="acc-color-grid" class="grid grid-cols-8 gap-2"></div>
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Icon</label>
          <div id="acc-icon-grid" class="grid grid-cols-8 gap-2 max-h-32 overflow-y-auto no-scrollbar"></div>
        </div>

        <label class="flex items-center gap-2 text-xs text-txt-secondary cursor-pointer select-none">
          <input id="acc-default" type="checkbox" class="w-4 h-4 rounded border-brd bg-bg-secondary accent-accent" />
          Set as default account
        </label>

        <button type="submit"
                class="w-full h-11 rounded-xl bg-accent hover:bg-accent-hover text-[#06221a] font-semibold text-sm transition">
          Save Account
        </button>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/accounts.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
