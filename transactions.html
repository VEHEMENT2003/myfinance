<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyFinance — Transactions</title>
  <!-- Tailwind Compiled CSS (from Vercel build) -->
  <link rel="stylesheet" href="/assets/css/tailwind.css" />
  <!-- Custom MyFinance CSS -->
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <aside id="sidebar" class="sidebar hidden-mobile lg:!transform-none"></aside>
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <main class="lg:pl-[260px] min-h-screen pb-28 lg:pb-8">

    <header class="sticky top-0 z-20 bg-bg-primary/85 backdrop-blur border-b border-brd">
      <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16">
        <div class="flex items-center gap-3 lg:hidden">
          <button data-open-sidebar class="w-9 h-9 rounded-lg bg-bg-card border border-brd flex items-center justify-center">
            <i data-lucide="menu" class="w-4 h-4 text-txt-primary"></i>
          </button>
          <span class="font-bold text-txt-primary">Transactions</span>
        </div>
        <div class="hidden lg:block">
          <h1 class="text-xl font-bold text-txt-primary">Transactions</h1>
          <div class="text-xs text-txt-secondary">All your income, expenses and transfers</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-add-tx"
                  class="h-9 px-3 rounded-lg bg-accent hover:bg-accent-hover text-[#06221a] text-xs font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Add Transaction</span>
          </button>
          <button data-signout class="w-9 h-9 rounded-full bg-accent-2 flex items-center justify-center text-txt-primary text-xs font-bold">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="px-4 sm:px-6 lg:px-8 pt-6 max-w-[1400px] mx-auto">
      <div class="card p-4 space-y-3">

        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 text-txt-secondary absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input id="f-search" type="search" placeholder="Search transactions…"
                   class="w-full h-10 pl-9 pr-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary placeholder:text-txt-secondary/60 focus:outline-none focus:border-accent" />
          </div>
          <div class="grid grid-cols-4 gap-1 p-1 rounded-lg bg-bg-secondary border border-brd">
            <button data-type-filter=""         class="type-tab px-3 h-8 rounded-md text-xs font-medium transition">All</button>
            <button data-type-filter="income"   class="type-tab px-3 h-8 rounded-md text-xs font-medium transition">Income</button>
            <button data-type-filter="expense"  class="type-tab px-3 h-8 rounded-md text-xs font-medium transition">Expense</button>
            <button data-type-filter="transfer" class="type-tab px-3 h-8 rounded-md text-xs font-medium transition">Transfer</button>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <input id="f-from" type="date"
                 class="h-9 px-3 rounded-lg bg-bg-secondary border border-brd text-xs text-txt-primary focus:outline-none focus:border-accent" />
          <input id="f-to" type="date"
                 class="h-9 px-3 rounded-lg bg-bg-secondary border border-brd text-xs text-txt-primary focus:outline-none focus:border-accent" />
          <select id="f-account"
                  class="h-9 px-3 rounded-lg bg-bg-secondary border border-brd text-xs text-txt-primary focus:outline-none focus:border-accent">
            <option value="">All accounts</option>
          </select>
          <select id="f-category"
                  class="h-9 px-3 rounded-lg bg-bg-secondary border border-brd text-xs text-txt-primary focus:outline-none focus:border-accent">
            <option value="">All categories</option>
          </select>
        </div>

        <div class="flex items-center justify-between text-[11px]">
          <button id="btn-clear-filters" class="text-txt-secondary hover:text-accent">Clear filters</button>
          <div id="view-totals" class="text-txt-secondary"></div>
        </div>
      </div>
    </div>

    <div class="px-4 sm:px-6 lg:px-8 py-6 max-w-[1400px] mx-auto">
      <div id="tx-list" class="space-y-4"></div>
    </div>
  </main>

  <button id="fab-add-tx" class="fab lg:hidden" aria-label="Add transaction">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <nav id="mobile-nav" class="bottom-nav lg:hidden"></nav>

  <!-- Add / Edit Transaction Modal -->
  <div id="tx-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4 py-6 overflow-y-auto">
    <div data-modal-backdrop class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-lg card p-6 my-auto">

      <div class="flex items-center justify-between mb-4">
        <h2 id="tx-modal-title" class="text-base font-semibold text-txt-primary">Add Transaction</h2>
        <button data-close-modal class="w-8 h-8 rounded-lg bg-bg-secondary border border-brd flex items-center justify-center text-txt-secondary hover:text-txt-primary transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="grid grid-cols-3 gap-1 p-1 rounded-xl bg-bg-secondary border border-brd mb-4">
        <button type="button" data-tx-type="expense"  class="tx-type-btn h-9 rounded-lg text-xs font-semibold transition">Expense</button>
        <button type="button" data-tx-type="income"   class="tx-type-btn h-9 rounded-lg text-xs font-semibold transition">Income</button>
        <button type="button" data-tx-type="transfer" class="tx-type-btn h-9 rounded-lg text-xs font-semibold transition">Transfer</button>
      </div>

      <form id="tx-form" class="space-y-3">

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Amount</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-txt-secondary text-sm">₹</span>
            <input id="tx-amount" type="number" step="0.01" min="0.01" required
                   class="w-full h-11 pl-8 pr-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-txt-secondary mb-1.5">Date</label>
            <input id="tx-date" type="date" required
                   class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent" />
          </div>
          <div>
            <label class="block text-xs text-txt-secondary mb-1.5">Time</label>
            <input id="tx-time" type="time" required
                   class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent" />
          </div>
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Title</label>
          <input id="tx-title" type="text" required maxlength="120"
                 placeholder="e.g. Grocery shopping"
                 class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary placeholder:text-txt-secondary/60 focus:outline-none focus:border-accent" />
        </div>

        <div id="tx-category-wrap">
          <label class="block text-xs text-txt-secondary mb-1.5">Category</label>
          <select id="tx-category" required
                  class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent"></select>
        </div>

        <div>
          <label id="tx-account-label" class="block text-xs text-txt-secondary mb-1.5">Account</label>
          <select id="tx-account" required
                  class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent"></select>
        </div>

        <div id="tx-to-account-wrap" class="hidden">
          <label class="block text-xs text-txt-secondary mb-1.5">To Account</label>
          <select id="tx-to-account"
                  class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent"></select>
        </div>

        <div id="tx-mode-wrap">
          <label class="block text-xs text-txt-secondary mb-1.5">Payment Mode</label>
          <select id="tx-mode"
                  class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent">
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
            <option value="debit_card">Debit Card</option>
            <option value="credit_card">Credit Card</option>
            <option value="net_banking">Net Banking</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Notes <span class="opacity-60">(optional)</span></label>
          <textarea id="tx-desc" rows="2" maxlength="500"
                    class="w-full px-3 py-2 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary placeholder:text-txt-secondary/60 focus:outline-none focus:border-accent resize-none"
                    placeholder="Any additional details…"></textarea>
        </div>

        <button type="submit"
                class="w-full h-11 rounded-xl bg-accent hover:bg-accent-hover text-[#06221a] font-semibold text-sm transition">
          Save Transaction
        </button>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/transactions.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
