<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyFinance — Analytics</title>
  <!-- Tailwind Compiled CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <aside id="sidebar" class="sidebar hidden-mobile lg:!transform-none"></aside>
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <main class="lg:pl-[260px] min-h-screen pb-28 lg:pb-8">
    <header class="sticky top-0 z-20 bg-bg-primary/85 backdrop-blur border-b border-brd">
      <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16">
        <div class="flex items-center gap-3 lg:hidden">
          <button data-open-sidebar class="w-9 h-9 rounded-lg bg-bg-card border border-brd flex items-center justify-center">
            <i data-lucide="menu" class="w-4 h-4 text-txt-primary"></i>
          </button>
          <span class="font-bold text-txt-primary">Analytics</span>
        </div>
        <div class="hidden lg:block">
          <h1 class="text-xl font-bold text-txt-primary">Financial Analytics</h1>
          <div class="text-xs text-txt-secondary">Visualize your spending habits</div>
        </div>
        <div class="flex items-center gap-2">
          <select id="range-filter" class="h-9 px-3 rounded-lg bg-bg-card border border-brd text-xs text-txt-primary focus:outline-none focus:border-accent">
            <option value="this_month">This Month</option>
            <option value="last_month">Last Month</option>
            <option value="3_months">Last 3 Months</option>
            <option value="6_months">Last 6 Months</option>
            <option value="this_year">This Year</option>
          </select>
          <button data-signout class="w-9 h-9 rounded-full bg-accent-2 flex items-center justify-center text-txt-primary text-xs font-bold">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="px-4 sm:px-6 lg:px-8 py-6 max-w-[1400px] mx-auto space-y-6">
      
      <!-- KPI Cards -->
      <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="card p-5">
          <div class="text-xs text-txt-secondary mb-1">Total Income</div>
          <div id="kpi-income" class="text-2xl font-bold text-txt-primary">₹0</div>
        </div>
        <div class="card p-5">
          <div class="text-xs text-txt-secondary mb-1">Total Expenses</div>
          <div id="kpi-expense" class="text-2xl font-bold text-txt-primary">₹0</div>
        </div>
        <div class="card p-5">
          <div class="text-xs text-txt-secondary mb-1">Net Savings</div>
          <div id="kpi-savings" class="text-2xl font-bold text-txt-primary">₹0</div>
        </div>
      </section>

      <!-- Main Charts -->
      <section class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div class="card p-5">
          <h2 class="text-sm font-semibold text-txt-primary mb-4">Income vs Expenses</h2>
          <div class="relative" style="height: 300px;">
            <canvas id="chart-cashflow"></canvas>
          </div>
        </div>
        <div class="card p-5">
          <h2 class="text-sm font-semibold text-txt-primary mb-4">Expense Breakdown</h2>
          <div class="relative" style="height: 300px;">
            <canvas id="chart-categories"></canvas>
          </div>
        </div>
      </section>

      <!-- Bottom Charts -->
      <section class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div class="card p-5">
          <h2 class="text-sm font-semibold text-txt-primary mb-4">Spending by Payment Mode</h2>
          <div class="relative" style="height: 250px;">
            <canvas id="chart-modes"></canvas>
          </div>
        </div>
        <div class="card p-5">
          <h2 class="text-sm font-semibold text-txt-primary mb-4">Monthly Savings Trend</h2>
          <div class="relative" style="height: 250px;">
            <canvas id="chart-savings"></canvas>
          </div>
        </div>
      </section>

    </div>
  </main>

  <nav id="mobile-nav" class="bottom-nav lg:hidden"></nav>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/analytics.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
