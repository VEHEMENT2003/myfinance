<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyFinance — Calendar & Notes</title>
  <!-- Tailwind Compiled CSS (from Vercel build) -->
  <link rel="stylesheet" href="/assets/css/tailwind.css" />
  <!-- Custom MyFinance CSS -->
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <aside id="sidebar" class="sidebar hidden-mobile lg:!transform-none"></aside>
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <main class="lg:pl-[260px] min-h-screen pb-28 lg:pb-8">
    <header class="sticky top-0 z-20 bg-bg-primary/85 backdrop-blur border-b border-brd">
      <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16">
        <div class="flex items-center gap-3 lg:hidden">
          <button data-open-sidebar class="w-9 h-9 rounded-lg bg-bg-card border border-brd flex items-center justify-center">
            <i data-lucide="menu" class="w-4 h-4 text-txt-primary"></i>
          </button>
          <span class="font-bold text-txt-primary">Calendar</span>
        </div>
        <div class="hidden lg:block">
          <h1 class="text-xl font-bold text-txt-primary">Calendar & Notes</h1>
          <div class="text-xs text-txt-secondary">Daily financial tracking</div>
        </div>
        <div class="flex items-center gap-2">
          <button data-signout class="w-9 h-9 rounded-full bg-accent-2 flex items-center justify-center text-txt-primary text-xs font-bold">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="px-4 sm:px-6 lg:px-8 py-6 max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Calendar -->
      <div class="lg:col-span-2 card p-4 sm:p-6">
        <div class="flex items-center justify-between mb-6">
          <h2 id="cal-month-year" class="text-lg font-bold text-txt-primary">Month Year</h2>
          <div class="flex gap-2">
            <button id="cal-prev" class="w-8 h-8 rounded-lg bg-bg-secondary border border-brd flex items-center justify-center hover:border-accent">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button id="cal-next" class="w-8 h-8 rounded-lg bg-bg-secondary border border-brd flex items-center justify-center hover:border-accent">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        
        <div class="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-semibold text-txt-secondary">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="cal-grid" class="grid grid-cols-7 gap-1 auto-rows-fr"></div>
      </div>

      <!-- Sidebar (Notes & Transactions) -->
      <div class="space-y-4">
        <div class="card p-4">
          <h3 id="side-date-label" class="text-sm font-semibold text-txt-primary mb-3">Select a date</h3>
          <div id="side-transactions" class="space-y-2 max-h-60 overflow-y-auto no-scrollbar"></div>
        </div>
        
        <div class="card p-4">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-sm font-semibold text-txt-primary">Daily Note</h3>
            <button id="btn-save-note" class="text-[11px] font-medium text-accent hover:underline hidden">Save</button>
          </div>
          <textarea id="note-input" rows="4" placeholder="Write a note for this day..." 
                    class="w-full px-3 py-2 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary placeholder:text-txt-secondary/50 focus:outline-none focus:border-accent resize-none"></textarea>
        </div>
      </div>
    </div>
  </main>

  <nav id="mobile-nav" class="bottom-nav lg:hidden"></nav>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/calendar.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
