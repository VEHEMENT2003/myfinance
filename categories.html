<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyFinance — Categories</title>
  <!-- Tailwind Compiled CSS (from Vercel build) -->
  <link rel="stylesheet" href="/assets/css/tailwind.css" />
  <!-- Custom MyFinance CSS -->
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <aside id="sidebar" class="sidebar hidden-mobile lg:!transform-none"></aside>
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <main class="lg:pl-[260px] min-h-screen pb-28 lg:pb-8">

    <header class="sticky top-0 z-20 bg-bg-primary/85 backdrop-blur border-b border-brd">
      <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16">
        <div class="flex items-center gap-3 lg:hidden">
          <button data-open-sidebar class="w-9 h-9 rounded-lg bg-bg-card border border-brd flex items-center justify-center">
            <i data-lucide="menu" class="w-4 h-4 text-txt-primary"></i>
          </button>
          <span class="font-bold text-txt-primary">Categories</span>
        </div>
        <div class="hidden lg:block">
          <h1 class="text-xl font-bold text-txt-primary">Categories</h1>
          <div class="text-xs text-txt-secondary">Organise income and expenses with labels</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-add-category"
                  class="h-9 px-3 rounded-lg bg-accent hover:bg-accent-hover text-[#06221a] text-xs font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span class="hidden sm:inline">New Category</span>
          </button>
          <button data-signout class="w-9 h-9 rounded-full bg-accent-2 flex items-center justify-center text-txt-primary text-xs font-bold">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="px-4 sm:px-6 lg:px-8 py-6 max-w-[1400px] mx-auto space-y-5">

      <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-bg-secondary border border-brd max-w-sm">
        <button id="tab-expense" class="cat-tab h-9 rounded-lg text-xs font-semibold transition">Expense</button>
        <button id="tab-income"  class="cat-tab h-9 rounded-lg text-xs font-semibold transition">Income</button>
      </div>

      <div id="cat-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>
  </main>

  <button id="fab-add-category" class="fab lg:hidden" aria-label="Add category">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <nav id="mobile-nav" class="bottom-nav lg:hidden"></nav>

  <!-- Add/Edit Category Modal -->
  <div id="cat-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4 py-6 overflow-y-auto">
    <div data-modal-backdrop class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-md card p-6 my-auto">

      <div class="flex items-center justify-between mb-4">
        <h2 id="cat-modal-title" class="text-base font-semibold text-txt-primary">New Category</h2>
        <button data-close-modal class="w-8 h-8 rounded-lg bg-bg-secondary border border-brd flex items-center justify-center text-txt-secondary hover:text-txt-primary transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="cat-form" class="space-y-3">

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Type</label>
          <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-bg-secondary border border-brd">
            <button type="button" data-cat-type="expense" class="cat-type-btn h-9 rounded-lg text-xs font-semibold transition">Expense</button>
            <button type="button" data-cat-type="income"  class="cat-type-btn h-9 rounded-lg text-xs font-semibold transition">Income</button>
          </div>
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Name</label>
          <input id="cat-name" type="text" required maxlength="60"
                 class="w-full h-11 px-3 rounded-lg bg-bg-secondary border border-brd text-sm text-txt-primary focus:outline-none focus:border-accent" />
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Color</label>
          <div id="cat-color-grid" class="grid grid-cols-8 gap-2"></div>
        </div>

        <div>
          <label class="block text-xs text-txt-secondary mb-1.5">Icon</label>
          <div id="cat-icon-grid" class="grid grid-cols-8 gap-2 max-h-32 overflow-y-auto no-scrollbar"></div>
        </div>

        <button type="submit"
                class="w-full h-11 rounded-xl bg-accent hover:bg-accent-hover text-[#06221a] font-semibold text-sm transition">
          Save Category
        </button>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/categories.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
